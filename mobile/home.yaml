path: mobile
title: Mobile
icon: mdi:apple
cards:
  - type: vertical-stack
    cards:
      # Row 1
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-person-card
            entity: person.paul
            icon_type: entity-picture
            tap_action:
              action: navigate
              navigation_path: "#paul"
          - type: custom:mushroom-person-card
            entity: person.ashley
            icon_type: entity-picture
            tap_action:
              action: navigate
              navigation_path: "#ashley"
      # Row 2
      - type: horizontal-stack
        cards:
          - type: picture
            image: /local/images/cards/aiBed.jpg
            tap_action:
              action: navigate
              navigation_path: "#bedroom"
          - type: picture
            image: /local/images/cards/aiRoborock.jpg
            tap_action:
              action: navigate
              navigation_path: "#vacuum"
      # Row 3
      - type: horizontal-stack
        cards:
          - type: picture
            image: /local/images/cards/aiPorch.jpg
            tap_action:
              action: navigate
              navigation_path: "#outside"
          - type: picture
            image: /local/images/cards/aiLiving.jpg
            tap_action:
              action: navigate
              navigation_path: "#living_room"
  - !include submenu/paul.yaml
  - !include submenu/ashley.yaml
  - !include submenu/master_bedroom.yaml
  - !include submenu/vacuum.yaml
  - !include submenu/outside.yaml
  - !include submenu/living_room.yaml
